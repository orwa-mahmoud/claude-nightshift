name: release

# The manifest version is what installs pin to, so it is the source of truth for a release.
# Landing a version bump on main tags that commit and publishes its CHANGELOG section as the
# release notes; a push that leaves the version alone is a no-op. Nothing else is published —
# the marketplace serves main directly.
#
# It runs on ci's completion rather than on the push itself: both trigger from the same event, so
# as parallel workflows this one published while the tests were still running. A version users
# install is a version whose suite went green on that exact commit.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# No permission at the top: a workflow-level grant reaches every job that is ever added here,
# and only the one that tags needs to write.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag the commit and create the release
    # A failed or cancelled run publishes nothing. The head_repository test keeps the checkout
    # below on this repository's own commits: workflow_run carries write permission, so a run
    # started from a fork must never reach it.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          # The commit ci actually tested. Without this, workflow_run checks out whatever main
          # points at now, which is a different tree the moment a second merge lands behind this
          # one — and the tag would name a commit nothing verified.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the manifest version
        id: manifest
        run: |
          set -eu
          version="$(jq -er '.version' plugin/.claude-plugin/plugin.json)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "manifest version '$version' is not semver" >&2; exit 1 ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Stop early when this version is already released
        id: check
        env:
          TAG: v${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to release"
            echo "todo=no" >>"$GITHUB_OUTPUT"
          else
            echo "todo=yes" >>"$GITHUB_OUTPUT"
          fi

      # Before anything is published, so a missing entry fails while it is still cheap to fix
      # rather than leaving a tag standing with no notes behind it.
      - name: Take the release notes from the changelog
        if: steps.check.outputs.todo == 'yes'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          .github/release-notes.sh "$VERSION" /tmp/title /tmp/notes
          echo "title: $(cat /tmp/title)"

      - name: Tag and publish
        if: steps.check.outputs.todo == 'yes'
        env:
          TAG: v${{ steps.manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git -c user.name=github-actions[bot] \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "$(cat /tmp/title)"
          git push origin "$TAG"
          gh release create "$TAG" --title "$(cat /tmp/title)" --notes-file /tmp/notes
          echo "released $TAG"

name: release

# The manifest version is what installs pin to, so it is the source of truth for a release.
# Landing a version bump on main tags that commit; a push that leaves the version alone is a
# no-op. Nothing is published here — the marketplace serves main directly.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the manifest version
        id: manifest
        run: |
          set -eu
          version="$(jq -er '.version' .claude-plugin/plugin.json)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "manifest version '$version' is not semver" >&2; exit 1 ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Tag when the version is new
        env:
          TAG: v${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to release"
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "tagged $TAG"

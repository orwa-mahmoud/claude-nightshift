name: release

# The manifest version is what installs pin to, so it is the source of truth for a release.
# Landing a version bump on main tags that commit and publishes its CHANGELOG section as the
# release notes; a push that leaves the version alone is a no-op. Nothing else is published —
# the marketplace serves main directly.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the manifest version
        id: manifest
        run: |
          set -eu
          version="$(jq -er '.version' .claude-plugin/plugin.json)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "manifest version '$version' is not semver" >&2; exit 1 ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Stop early when this version is already released
        id: check
        env:
          TAG: v${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to release"
            echo "todo=no" >>"$GITHUB_OUTPUT"
          else
            echo "todo=yes" >>"$GITHUB_OUTPUT"
          fi

      # Before anything is published, so a missing entry fails while it is still cheap to fix
      # rather than leaving a tag standing with no notes behind it.
      - name: Take the release notes from the changelog
        if: steps.check.outputs.todo == 'yes'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 ~ "^## v" v "([ \t]|$)" { on = 1; sub(/^## /, ""); print > "/tmp/title"; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md >/tmp/notes
          [ -s /tmp/title ] || { echo "CHANGELOG.md has no '## v$VERSION' section" >&2; exit 1; }
          sed -i -e '/./,$!d' /tmp/notes
          [ -s /tmp/notes ] || { echo "the '## v$VERSION' section is empty" >&2; exit 1; }
          echo "title: $(cat /tmp/title)"

      - name: Tag and publish
        if: steps.check.outputs.todo == 'yes'
        env:
          TAG: v${{ steps.manifest.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git -c user.name=github-actions[bot] \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "$(cat /tmp/title)"
          git push origin "$TAG"
          gh release create "$TAG" --title "$(cat /tmp/title)" --notes-file /tmp/notes
          echo "released $TAG"

name: ci

# A branch push and its pull request are the same commit, so an unfiltered `push` ran every job
# twice for no extra signal. Branch work is covered by `pull_request`; `push` is here for main,
# where there is no PR to carry it — and where a green run is what lets release publish.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        run: |
          set -eu
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          echo "$files"
          # shellcheck honors the directive in each file; -x follows sourced paths
          echo "$files" | xargs shellcheck -x

  # Installs are pinned to the manifest version, so shipped files changing without a bump means
  # nobody receives the change. Only a pull request can compare against a base.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump when shipped files change, and notes for a bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # The manifest moved under plugin/ in v0.7.4. Read whichever path that commit has, so
          # the commit performing the move can still be compared against the one before it.
          manifest_at() {
            git show "$1:plugin/.claude-plugin/plugin.json" 2>/dev/null \
              || git show "$1:.claude-plugin/plugin.json"
          }
          before="$(manifest_at "$BASE" | jq -r '.version')"
          after="$(manifest_at "$HEAD" | jq -r '.version')"

          # A bump is a release: the release job reads its notes from the changelog, so a missing
          # section must fail here rather than after the merge, when main is already red.
          if [ "$before" != "$after" ]; then
            echo "version $before -> $after"
            .github/release-notes.sh "$after" /tmp/title /tmp/notes
            echo "release notes found: $(cat /tmp/title)"
          fi

          # Installs pin to the version, so shipped files changing without one means nobody
          # receives the change.
          shipped="$(git diff --name-only "$BASE" "$HEAD" -- plugin/ hooks/ skills/ adapters/ .claude-plugin/)"
          if [ -n "$shipped" ] && [ "$before" = "$after" ]; then
            echo "these shipped files changed but plugin/.claude-plugin/plugin.json version is still $after:"
            echo "$shipped" | sed 's/^/  /'
            echo "installs pin to that version, so users would never receive this change."
            exit 1
          fi

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run the bats suite
        run: |
          set -eu
          if ! ls tests/*.bats >/dev/null 2>&1; then
            echo "no bats tests yet"
            exit 0
          fi
          # -r so tests/shifts/ runs too: a contributed shift brings its own test file, and a
          # suite that skipped the subdirectory would report green on an entry nobody checked.
          bats -r tests/

  bats-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: brew install bats-core
      - name: Run the bats suite under macOS system bash
        run: |
          set -eu
          bats_bin="$(command -v bats)"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin"
          export PATH
          command -v bash
          bash --version
          "$bats_bin" -r tests/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict

name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        run: |
          set -eu
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          echo "$files"
          # shellcheck honors the directive in each file; -x follows sourced paths
          echo "$files" | xargs shellcheck -x

  # Installs are pinned to the manifest version, so shipped files changing without a bump means
  # nobody receives the change. Only a pull request can compare against a base.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a version bump when shipped files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          shipped="$(git diff --name-only "$BASE" "$HEAD" -- hooks/ skills/ adapters/ .claude-plugin/)"
          [ -n "$shipped" ] || { echo "no shipped files changed"; exit 0; }
          before="$(git show "$BASE:.claude-plugin/plugin.json" | jq -r '.version')"
          after="$(git show "$HEAD:.claude-plugin/plugin.json" | jq -r '.version')"
          if [ "$before" = "$after" ]; then
            echo "these shipped files changed but .claude-plugin/plugin.json version is still $after:"
            echo "$shipped" | sed 's/^/  /'
            echo "installs pin to that version, so users would never receive this change."
            exit 1
          fi
          echo "version $before -> $after"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run the bats suite
        run: |
          set -eu
          if ! ls tests/*.bats >/dev/null 2>&1; then
            echo "no bats tests yet"
            exit 0
          fi
          bats tests/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict

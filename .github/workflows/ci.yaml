name: ci

# A branch push and its pull request are the same commit, so an unfiltered `push` ran every job
# twice for no extra signal. Branch work is covered by `pull_request`; `push` is here for main,
# where there is no PR to carry it — and where a green run is what lets release publish.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: the suite reads the tree and reports. Declaring it means
# a job that starts wanting more fails rather than inheriting whatever the default happens to be.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint every shell script
        run: |
          set -eu
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          echo "$files"
          # shellcheck honors the directive in each file; -x follows sourced paths
          echo "$files" | xargs shellcheck -x

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Run the bats suite
        run: |
          set -eu
          if ! ls tests/*.bats >/dev/null 2>&1; then
            echo "no bats tests yet"
            exit 0
          fi
          # -r so tests/shifts/ runs too: a contributed shift brings its own test file, and a
          # suite that skipped the subdirectory would report green on an entry nobody checked.
          bats -r tests/

  bats-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: brew install bats-core
      - name: Run the bats suite under macOS system bash
        run: |
          set -eu
          bats_bin="$(command -v bats)"
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin:/usr/local/bin"
          export PATH
          command -v bash
          bash --version
          "$bats_bin" -r tests/

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run native Windows lifecycle suite
        run: ./tests/windows/run.ps1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
